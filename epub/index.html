<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EPUB Reader</title>
  <meta name="description" content="Private read-aloud for EPUB books in your Google Drive">
  <meta name="theme-color" content="#f6f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EPUB Reader">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============ LIBRARY ============ -->
  <section id="view-library" class="view">
    <header class="topbar">
      <h1 class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28"> EPUB Reader</h1>
      <div class="topbar-actions">
        <button id="btn-refresh" class="icon-btn" aria-label="Refresh library" title="Refresh">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <div id="signin-card" class="card signin" hidden>
      <p class="signin-title">Your private EPUB library</p>
      <p class="muted">Sign in with Google to listen to the books in your <b>EPUB Reader Library</b> Drive folder. Read-only access. Books go straight from your Drive to this device — no server in between.</p>
      <button id="btn-signin" class="btn primary">
        <svg viewBox="0 0 24 24" class="g"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h6a5.1 5.1 0 0 1-2.2 3.4v2.8h3.6c2-1.9 3.2-4.7 3.2-8.2z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.4-2.7l-3.6-2.8c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14c-.2-.7-.4-1.3-.4-2s.1-1.4.4-2V7.1H2a11 11 0 0 0 0 9.8L5.7 14z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2 7.1L5.7 10c.9-2.6 3.4-4.6 6.3-4.6z"/></svg>
        Sign in with Google
      </button>
      <p id="signin-note" class="note"></p>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" class="search-ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search your books" autocomplete="off" enterkeyhint="search" aria-label="Search">
    </div>
    <nav id="tag-chips" class="chips" aria-label="Filter by tag"></nav>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <main id="library-list" class="library"></main>
  </section>

  <!-- ============ READER ============ -->
  <section id="view-reader" class="view" hidden>
    <header class="topbar reader-top">
      <button id="btn-back" class="icon-btn" aria-label="Back to library">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="reader-title">
        <div id="doc-title" class="doc-title"></div>
        <button id="doc-sub" class="doc-sub muted linkish" aria-label="Current chapter (tap for chapter list)"></button>
      </div>
      <button id="btn-chapters" class="icon-btn" aria-label="Chapters" title="Chapters">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
      <button id="btn-settings2" class="icon-btn" aria-label="Voice and speed settings">
        <svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      </button>
    </header>
    <div class="progress-line"><div id="doc-progress"></div></div>
    <article id="doc-text" class="doc-text" aria-live="off"></article>

    <footer class="player">
      <div class="player-row">
        <button id="btn-prev-para" class="icon-btn" aria-label="Previous paragraph" title="Previous paragraph">
          <svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8zM5 19V5"/></svg>
        </button>
        <button id="btn-prev-sent" class="icon-btn" aria-label="Previous sentence" title="Previous sentence">
          <svg viewBox="0 0 24 24"><path d="M11 19 2 12l9-7zM22 19l-9-7 9-7z"/></svg>
        </button>
        <button id="btn-play" class="play-btn" aria-label="Play">
          <svg id="ico-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
          <svg id="ico-pause" viewBox="0 0 24 24" hidden><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
        </button>
        <button id="btn-next-sent" class="icon-btn" aria-label="Next sentence" title="Next sentence">
          <svg viewBox="0 0 24 24"><path d="m13 19 9-7-9-7zM2 19l9-7-9-7z"/></svg>
        </button>
        <button id="btn-next-para" class="icon-btn" aria-label="Next paragraph" title="Next paragraph">
          <svg viewBox="0 0 24 24"><path d="m5 4 10 8-10 8zM19 5v14"/></svg>
        </button>
      </div>
      <div class="player-row small">
        <label class="speed">
          <span id="speed-val">1.00×</span>
          <input id="speed" type="range" min="0.75" max="2" step="0.05" value="1" aria-label="Reading speed">
        </label>
        <button id="btn-voice" class="pill" aria-label="Choose voice"><span id="voice-name">Voice</span> ▾</button>
      </div>
    </footer>
  </section>

  <!-- ============ CHAPTERS SHEET ============ -->
  <div id="chapters-backdrop" class="backdrop" hidden></div>
  <div id="chapters" class="sheet chapters-sheet" role="dialog" aria-modal="true" aria-labelledby="chapters-title" hidden>
    <div class="sheet-grip"></div>
    <div class="chapters-head">
      <h2 id="chapters-title">Chapters</h2>
      <div class="chapters-nav">
        <button id="btn-prev-ch" class="btn small">⏮ Prev</button>
        <button id="btn-next-ch" class="btn small">Next ⏭</button>
      </div>
    </div>
    <nav id="chapter-list" class="chapter-list" aria-label="Chapters"></nav>
    <button id="btn-chapters-close" class="btn primary wide">Close</button>
  </div>

  <!-- ============ SETTINGS SHEET ============ -->
  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-grip"></div>
    <h2 id="sheet-title">Settings</h2>
    <label class="field">
      <span>Voice</span>
      <select id="voice-select"></select>
      <small class="muted">Tip (iPhone): Settings → Accessibility → Spoken Content → Voices → English to download “Enhanced” or “Premium” voices. They then appear here.</small>
    </label>
    <button id="btn-voice-test" class="btn">Preview voice</button>
    <label class="field">
      <span>Speed <b id="speed-val2">1.00×</b></span>
      <input id="speed2" type="range" min="0.75" max="2" step="0.05" value="1">
    </label>
    <label class="field row">
      <span>Keep screen on while reading<br><small class="muted">Speech stops if the iPhone locks. This keeps it awake.</small></span>
      <input id="wake-toggle" type="checkbox" class="switch" checked>
    </label>
    <label class="field row">
      <span>Auto-scroll to current sentence</span>
      <input id="follow-toggle" type="checkbox" class="switch" checked>
    </label>
    <div class="field">
      <span>Appearance</span>
      <div class="seg" id="theme-seg">
        <button data-theme="auto">Auto</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button>
      </div>
    </div>
    <div class="field">
      <span>Account</span>
      <div class="acct-row">
        <span id="acct-status" class="muted"></span>
        <button id="btn-signout" class="btn small">Sign out</button>
      </div>
      <button id="btn-clear-cache" class="btn small ghost">Clear cached text on this device</button>
    </div>
    <button id="btn-sheet-close" class="btn primary wide">Done</button>
  </div>

  <div id="toast" class="toast" role="alert" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
